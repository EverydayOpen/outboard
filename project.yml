# XcodeGen spec. Run `xcodegen generate` (CI does); the .xcodeproj is never committed.
name: Outboard
options:
  deploymentTarget:
    macOS: "13.0"   # BUILD_PLAN section 1: ImageRenderer, NavigationSplitView, MenuBarExtra and SMAppService need macOS 13
packages:
  Outboard:
    path: .   # this repo's Package.swift (OutboardCore + OutboardMac). VERIFY: Xcode accepts a local package in the project's own folder (Aftertaste, Overstay and Tirekick do the same).
targets:
  Outboard:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: Outboard
        products:
          - OutboardCore
          - OutboardMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.everydayopen.outboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # mooring cobalt, the one accent
        GENERATE_INFOPLIST_FILE: "NO"
        DEAD_CODE_STRIPPING: "YES"
        # Set directly instead of `info:`/`entitlements:`, which would regenerate (overwrite) these hand-written files.
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Outboard.entitlements
schemes:
  Outboard:
    build:
      targets:
        Outboard: all
