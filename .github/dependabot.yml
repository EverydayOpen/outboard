# Keeps the SHA-pinned actions in .github/workflows current: one grouped PR a week, SHA and "# vX.Y.Z" comment together.
# Not covered: XCODEGEN(_SHA256) in the workflows' env; bump it by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
