# Build the website and deploy it to this repo's gh-pages branch (created on the first run).
# build runs the repo's code with a read-only token; deploy holds the write token, has no checkout and only pushes the artifact.
# (Pages-from-Actions would drop the push entirely but needs the Pages source switched; docs/GO_LIVE.md step 2.4.)
# The deploy never deletes or overwrites CNAME, which exists only if you add a custom domain (docs/GO_LIVE.md step 4).
#
# Enabling GitHub Pages (once, after the first run): Settings › Pages › Build and deployment › Source "Deploy from a
# branch", branch gh-pages, folder / (root). The site is then https://everydayopen.github.io/outboard/, which must
# equal site/site.json baseURL.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "tools/build_site.py", "tools/changelog.py", "tools/safety_greps.sh", "tools/banned_phrases.txt", "Tests/OutboardCoreTests/Fixtures/export/**", "Sources/OutboardCore/Demo/DemoScenarios.swift", "Sources/OutboardCore/Text/GuidedText.swift", "Sources/OutboardCore/Model/Names.swift", "tools/check_recipes.py", "tools/make_og.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: site   # two deploys never push at once; a newer pending run replaces an older one

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check
        run: |
          # /download/ is built from site.json, so it must name this repo, where release.yml publishes the DMG.
          [ "$(jq -r .releasesRepo site/site.json)" = "$GITHUB_REPOSITORY" ] || { echo "::error::site/site.json releasesRepo must equal $GITHUB_REPOSITORY"; exit 1; }
          # Every canonical, feed and sitemap URL comes from baseURL, and the footer names owner.
          jq -e '[.baseURL, .owner] | all(test("REPLACE_ME|OWNER") | not)' site/site.json > /dev/null || { echo "::error::Fill site/site.json baseURL and owner before deploying (docs/GO_LIVE.md)"; exit 1; }
          # The site deploys on every push to main, so it gets the same banned-phrase gate as ci.yml (the mutation self-tests run there).
          SAFETY_FAST=1 bash tools/safety_greps.sh
          python3 tools/build_site.py --check
          python3 tools/build_site.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/_dist
          include-hidden-files: true   # .nojekyll
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes gh-pages with github.token
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/_dist

      - name: Deploy to gh-pages (keeps CNAME)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The token travels as a header, never in the remote URL (which would sit in pages/.git/config and in error output).
          # The first run has no gh-pages branch yet, so the clone prints one error line before the git-init fallback.
          REMOTE="https://github.com/$GITHUB_REPOSITORY.git"
          AUTH="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH##*basic }"
          git -c "$AUTH" clone --depth 1 --branch gh-pages "$REMOTE" pages \
            || { git init -b gh-pages pages && git -C pages remote add origin "$REMOTE"; }
          rsync -a --delete --exclude .git --exclude CNAME site/_dist/ pages/
          cd pages
          git add -A
          if git diff --cached --quiet; then echo "Site unchanged"; exit 0; fi
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -m "site ${GITHUB_SHA::7}"
          git -c "$AUTH" push origin gh-pages
