# Window captures of every screen, light and dark, as the `screens` artifact (<screen>-<look>.png), and the README hero's
# frames and the Storage Plan cards as the `hero-frames` artifact. A Debug build opens each screen with `-demoScreen <name>`
# (App/Demo.swift): a synthetic Mac and synthetic drives built in Core (DemoBackend, real catalogue apps with fictional sizes),
# so nothing real is read, moved or mounted. The hero's runs are recorded from a Release build with the demo code compiled in
# (a Debug build is too slow on a runner to judge the animation). Nothing is committed or published from here; the lead picks
# what goes into site/static/shots/ and the README.
#
# Outboard is a window app: the main window opens at launch, so every capture is a plain window capture. The sheets (consent,
# progress, "The move is ready", the Confirm dialog, the result, the guided card, the export preview, Preferences, the first-run
# cards) hang from that window, so those screens are also captured as the window's screen rect (`<name>-<look>-region.png`).
# Not captured here, and the README says so: the real menu bar item (it only exists once a relocation does, and a menu bar item
# cannot be captured headlessly, VERIFY), and anything that needs a real drive. This workflow attaches no disk image (G5: hdiutil
# is for tests and the probe workflow only), so it needs no detach step. Every PNG is checked in the "Verify captures" step
# before the artifact is uploaded.
name: screens

on:
  workflow_dispatch:
  pull_request:
    paths: ["App/**", "Sources/**", ".github/workflows/screens.yml"]

permissions:
  contents: read

env:
  APP: Outboard
  XCODEGEN: "2.46.0"   # checksum-pinned, same pin as ci.yml, beta.yml, release.yml, fixtures.yml and codeql.yml: bump all together
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

defaults:
  run:
    shell: bash

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Generate project (XcodeGen, checksum-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/xcodegen/share/xcodegen/SettingPresets"   # without them xcodegen only prints a warning
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      # Demo mode exists only with DEBUG, set explicitly so a preset change can't turn every capture into the real app.
      # Ad-hoc signed like beta.yml, this runner's arch only.
      - name: Build (Debug)
        run: |
          xcodebuild -project Outboard.xcodeproj -scheme Outboard -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/dd \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" ENABLE_HARDENED_RUNTIME=NO build

      # A Debug build is unoptimised and pegs a runner VM, so a recording of it says nothing about how the progress bar and the
      # sheets animate. The hero is recorded from this one: Release (optimised, arm64 only) with the demo code compiled in,
      # DEBUG set explicitly again. The stills stay on the Debug build above. Best effort: without it the hero falls back to Debug.
      - name: Build (Release with the demo code, for the hero)
        continue-on-error: true
        run: |
          xcodebuild -project Outboard.xcodeproj -scheme Outboard -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/dd-release \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" ENABLE_HARDENED_RUNTIME=NO build

      # `open` launches and activates the app, so windows are captured active. The window number and bounds come from the
      # window server by owner name (no Screen Recording needed for that). The widest window no wider than <max> wins, so a
      # sheet (its own, smaller window) never beats the window it hangs from.
      - name: Capture helpers
        run: |
          cat > "$RUNNER_TEMP/window.swift" <<'EOF'
          import CoreGraphics
          CGWarpMouseCursorPosition(.zero)   // pointer out of the window: no hover state in a capture
          let arguments = CommandLine.arguments
          let widest = arguments.count > 2 ? Double(arguments[2]) ?? .infinity : .infinity
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          var best: (id: Int, rect: CGRect)?
          for window in windows where window[kCGWindowOwnerName as String] as? String == arguments[1] && window[kCGWindowLayer as String] as? Int == 0 {
              guard let bounds = window[kCGWindowBounds as String], let rect = CGRect(dictionaryRepresentation: bounds as! CFDictionary),
                    rect.width <= widest, rect.width * rect.height > (best.map { $0.rect.width * $0.rect.height } ?? 0) else { continue }
              best = (window[kCGWindowNumber as String] as? Int ?? 0, rect)
          }
          if let best { print(best.id, Int(best.rect.minX), Int(best.rect.minY), Int(best.rect.width), Int(best.rect.height)) }
          EOF
          xcrun swiftc "$RUNNER_TEMP/window.swift" -o "$RUNNER_TEMP/window"
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          app="build/dd/Build/Products/Debug/$APP.app"
          win="$RUNNER_TEMP/window"
          # launch <screen> <look> [scenario] [scroll 0..1]. Always with -demoScreen: the app is never started without it here.
          launch() {
            [ -n "${1:-}" ] || { echo "::error::launch without a screen"; exit 1; }
            local args=(-demoScreen "$1" -demoAppearance "$2")
            if [ -n "${3:-}" ]; then args+=(-demoScenario "$3"); fi
            if [ -n "${4:-}" ]; then args+=(-demoScroll "$4"); fi
            open -n "$app" --args "${args[@]}"
          }
          # find_window <max width>: waits up to 30 s, sets $info to "id x y w h"
          find_window() {
            info=""
            for _ in $(seq 60); do info=$("$win" "$APP" "$1"); [ -n "$info" ] && return 0; sleep 0.5; done
            return 1
          }
          quit() {
            pkill -x "$APP" || true
            while pgrep -x "$APP" > /dev/null; do sleep 0.2; done
          }
          EOF
          # name|screen|scenario (empty: the screen's default)|max window width|also capture the screen rect (sheets)|scroll
          # (empty, or 0..1: how far down the main window's widest scrollable area is scrolled before the capture; the end of
          # the ranked list, the refusals below the first drive and the older journal days are below the fold otherwise)
          # The Storage Plan cards themselves are rendered by the app (-demoCardOut) in the hero step, not captured here.
          # The hero step copies plan-dark, consent-dark-region, moving-dark-region, verified-dark-region and restored-dark:
          # keep those rows.
          cat > "$RUNNER_TEMP/screens.list" <<'EOF'
          firstRun|firstRun||99999|1
          plan|plan||99999|0
          planRows|plan||99999|0|0.5
          planEnd|plan||99999|0|1
          card|card||99999|0
          partlyMeasured|plan|partly-measured|99999|0
          small|plan|small|99999|0
          quiet|quiet||99999|0
          journalBlocked|plan|journal-blocked|99999|0
          drivePicker|drivePicker||99999|0
          drivePickerEnd|drivePicker||99999|0|1
          consent|consent||99999|1
          consentArchives|consent|consent-xcode-archives|99999|1
          consentIOS|consent|consent-ios-device-backups|99999|1
          consentOllama|consent|consent-ollama-models|99999|1
          consentHuggingFace|consent|consent-huggingface-hub-cache|99999|1
          guided|guided||99999|1
          moving|moving||99999|1
          verifying|moving|verifying|99999|1
          verified|verified||99999|1
          confirm|confirm||99999|1
          result|result||99999|1
          driveMissing|driveMissing||99999|0
          restored|restored||99999|0
          held|edge|held|99999|0
          conflict|edge|conflict|99999|0
          recovered|edge|recovered|99999|0
          needsAttention|edge|needs-attention|99999|0
          activity|activity||99999|0
          activityEnd|activity||99999|0|1
          report|report||99999|1
          preferences|preferences||99999|1
          about|about||99999|0
          EOF

      - name: Capture screens
        run: |
          source "$RUNNER_TEMP/lib.sh"
          mkdir -p screens
          # No mouse or trackpad on the runner, so macOS shows always-on legacy scroll bars. Each screen is a fresh
          # launch, which reads the global domain.
          defaults write -g AppleShowScrollBars -string WhenScrolling
          for look in light dark; do
            while IFS='|' read -r -u 3 name screen scenario max region scroll; do   # empty fields stay empty: '|' is not whitespace
              launch "$screen" "$look" "$scenario" "$scroll"
              if ! find_window "$max"; then
                screencapture -x "screens/no-window-$name.png"
                echo "::error::No $APP window for $name ($look) within 30 s"
                exit 1
              fi
              set -- $info
              sleep 7   # the first measurement, the whole demo move of the longest flows (about 1.2 s), entrance animations, the scroll passes (3, 4 and 5 s after launch)
              screencapture -x -l"$1" "screens/$name-$look.png"
              if [ "$region" = 1 ]; then
                # A sheet may not be part of a single-window capture (VERIFY): the window's screen rect has it.
                set -- $("$win" "$APP" "$max")
                screencapture -x -R "$2,$3,$4,$5" "screens/$name-$look-region.png"
              fi
              quit
            done 3< "$RUNNER_TEMP/screens.list"   # fd 3: open, screencapture and the rest never read the list
          done
          ls -l screens

      # A blank, missing or truncated PNG would still upload as a green run. Every expected file must exist, be a PNG of a
      # plausible size and not be (nearly) empty (a blank window compresses to a few KB), and a screen must differ between
      # light and dark (the -demoAppearance argument took effect).
      - name: Verify captures
        run: |
          python3 - "$RUNNER_TEMP/screens.list" screens <<'PY'
          import os, struct, sys
          rows = [l.strip().split("|") for l in open(sys.argv[1]) if l.strip()]
          out, bad = sys.argv[2], []
          def check(path):
              if not os.path.isfile(path): return "missing"
              size = os.path.getsize(path)
              with open(path, "rb") as f: head = f.read(24)
              if head[:8] != b"\x89PNG\r\n\x1a\n": return "not a PNG"
              w, h = struct.unpack(">II", head[16:24])
              if w < 300 or h < 200: return "too small (%dx%d)" % (w, h)
              if size < 12000: return "only %d bytes, probably blank" % size
              return None
          for r in rows:
              name, region = r[0], r[4] == "1"
              for look in ("light", "dark"):
                  files = ["%s/%s-%s.png" % (out, name, look)] + (["%s/%s-%s-region.png" % (out, name, look)] if region else [])
                  for p in files:
                      why = check(p)
                      if why: bad.append("%s: %s" % (p, why))
              a, b = ("%s/%s-%s.png" % (out, name, l) for l in ("light", "dark"))
              if os.path.isfile(a) and os.path.isfile(b) and open(a, "rb").read() == open(b, "rb").read():
                  bad.append("%s: light and dark are identical" % name)
          for line in bad: print("::error::" + line)
          print("%d screens, %d problems" % (len(rows), len(bad)))
          sys.exit(1 if bad else 0)
          PY

      # The README hero, as two real recordings of the window while a hero screen plays (App/Demo.swift): `hero` is the Plan, the
      # consent sheet, a move whose progress bar runs for about 4.5 s, "The move is ready", then confirmed and the result;
      # `heroGuard` is Drives with the drive away (banner, parked notes) and then the same Mac with the drive back. The sheets are
      # the subject, so the window is captured by screen rect with the sheet in it. Each recording is a burst of screen-rect
      # captures, timestamped, so the frames are real animation, not a re-enactment. The first 1.6 s (the first measurement and
      # the entrance animations) are dropped. screencapture costs 100-250 ms per call (VERIFY), so up to three run at once, each
      # stamped when it starts; frames.ffconcat carries each frame's real duration. The run prints how many distinct frames it got:
      # a hero where nothing moved fails here, not in review. `heroGuard` changes less, so it needs fewer distinct frames.
      # The first, second, third, fifth and sixth frames of the set are stills from the captures above; the Storage Plan cards are rendered by the app itself
      # (-demoCardOut, 1200 x 630 at 2x, VERIFY ImageRenderer on the runner) for the plan, the plan with a guided line, and after moves.
      - name: Hero frames
        run: |
          source "$RUNNER_TEMP/lib.sh"
          mkdir -p hero-frames
          cp screens/plan-dark.png hero-frames/01-plan.png
          cp screens/consent-dark-region.png hero-frames/02-consent.png
          cp screens/moving-dark-region.png hero-frames/03-moving.png
          cp screens/verified-dark-region.png hero-frames/05-ready.png
          cp screens/restored-dark.png hero-frames/06-restored.png
          cat > "$RUNNER_TEMP/burst.py" <<'PY'
          import hashlib, os, subprocess, sys, time
          rect, out, seconds, skip, need = sys.argv[1], sys.argv[2], float(sys.argv[3]), float(sys.argv[4]), int(sys.argv[5])
          start = time.monotonic()
          shots = []   # (seconds since start, file, process)
          while time.monotonic() - start < seconds:
              path = "%s/f%03d.png" % (out, len(shots))
              shots.append((time.monotonic() - start, path, subprocess.Popen(["screencapture", "-x", "-R", rect, path])))
              while sum(p.poll() is None for _, _, p in shots[-3:]) >= 3: time.sleep(0.01)
              time.sleep(0.02)
          end = time.monotonic() - start
          for _, _, p in shots: p.wait()
          good = [(t, f) for t, f, p in shots if p.returncode == 0 and os.path.getsize(f) > 0 and t >= skip]
          distinct = len({hashlib.md5(open(f, "rb").read()).hexdigest() for _, f in good})
          print("%d of %d frames kept (%d distinct), %.1f fps" % (len(good), len(shots), distinct, len(good) / max(end - skip, 1)))
          if len(good) < 20: sys.exit("::error::too few hero frames")
          if distinct < need: sys.exit("::error::the hero barely changes: nothing moved in the window")
          with open(out + "/frames.ffconcat", "w") as f:
              f.write("ffconcat version 1.0\n")
              for i, (t, name) in enumerate(good):
                  hold = 1.5 if i + 1 == len(good) else 0   # the last frame stays up before the GIF loops
                  f.write("file '%s'\nduration %.3f\n" % (os.path.basename(name), (good[i + 1][0] if i + 1 < len(good) else end) - t + hold))
              f.write("file '%s'\n" % os.path.basename(good[-1][1]))   # the concat demuxer drops the last duration unless the file repeats
          PY
          # The recording uses the Release build with the demo code when it was built (smooth animation); else the Debug one.
          debug_app="$app"
          release_app="build/dd-release/Build/Products/Release/$APP.app"
          if [ -d "$release_app" ]; then app="$release_app"; echo "hero: Release build"; else echo "::warning::hero: no Release build, recording the Debug build"; fi
          # record <screen> <folder> <seconds> <distinct frames needed>: a failed recording is reported at the end, after the cards are rendered too
          hero_failed=""
          record() {
            local screen=$1 folder=$2 seconds=$3 need=$4
            mkdir -p "hero-frames/$folder"
            launch "$screen" dark
            if find_window 99999; then
              set -- $info
              python3 "$RUNNER_TEMP/burst.py" "$2,$3,$4,$5" "hero-frames/$folder" "$seconds" 1.6 "$need" || hero_failed=1
            else
              echo "::error::No $APP window for $screen"
              hero_failed=1
            fi
            quit
          }
          record hero move 16.5 15
          record heroGuard guard 9.5 2
          app="$debug_app"
          # render_card <scenario> <file>: the app writes the PNG itself and quits
          render_card() {
            local out="$PWD/hero-frames/$2"
            open -n "$app" --args -demoScreen card -demoScenario "$1" -demoCardOut "$out"
            for _ in $(seq 60); do [ -s "$out" ] && break; sleep 0.5; done
            [ -s "$out" ] || { echo "::error::The card for $1 was not written"; exit 1; }
            for _ in $(seq 20); do pgrep -x "$APP" > /dev/null || break; sleep 0.5; done   # the app quits after writing
            quit
            # At least 1200 x 630 and no wider than the card's shape (the long variants grow taller): not a blank or a truncated file.
            python3 - "$out" <<'PY'
          import os, struct, sys
          with open(sys.argv[1], "rb") as f: head = f.read(24)
          ok = head[1:4] == b"PNG"
          w, h = struct.unpack(">II", head[16:24]) if ok else (0, 0)
          size = os.path.getsize(sys.argv[1])
          print("card %s: %dx%d, %d bytes" % (os.path.basename(sys.argv[1]), w, h, size))
          if not ok or h == 0 or w < 1200 or h < 630 or w / h > 1200 / 630 + 0.01 or size < 20000: sys.exit("::error::The Storage Plan card is not a PNG of the card's shape")
          PY
          }
          render_card plan 04-card-plan.png
          render_card plan-guided 04-card-guided.png
          render_card after-moves 07-card-after-moves.png
          cp hero-frames/04-card-plan.png screens/card-plan.png
          cp hero-frames/04-card-guided.png screens/card-guided.png
          cp hero-frames/07-card-after-moves.png screens/card-after-moves.png
          ls -l hero-frames
          ls hero-frames/move | wc -l
          ls hero-frames/guard | wc -l
          [ -z "$hero_failed" ] || exit 1

      # Best effort: Homebrew's ffmpeg bottle is the one unpinned download in this workflow (VERIFY it is quick enough),
      # so a failure here must not fail the captures. The frames above are the deliverable. Each run also gets a contact
      # sheet (a frame every 0.7 s, 4 across) to see at a glance whether the sheets came and went and the window stayed lit.
      - name: Hero GIF (best effort)
        continue-on-error: true
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v ffmpeg > /dev/null || brew install ffmpeg
          for name in move guard; do
            ffmpeg -y -loglevel error -f concat -i "hero-frames/$name/frames.ffconcat" \
              -vf "fps=12,scale=960:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse" \
              "hero-frames/$name.gif"
            ffmpeg -y -loglevel error -f concat -i "hero-frames/$name/frames.ffconcat" \
              -vf "fps=1/0.7,scale=480:-1,tile=4x4" -frames:v 1 "hero-frames/$name-sheet.png"
          done
          ls -l hero-frames/*.gif hero-frames/*-sheet.png

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens
          path: screens/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hero-frames
          path: hero-frames/
          if-no-files-found: warn
